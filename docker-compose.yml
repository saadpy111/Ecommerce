services:
  catalog.api:
    image: ${DOCKER_REGISTRY-}catalogapi
    container_name: catalog-api

    build:
      context: .
      dockerfile: Services/Catalog/Catalog.Api/Dockerfile

    ports:
      - "5000:8080"

    depends_on:
      - mongo

    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - DatabaseSettings__ConnectionString=mongodb://mongo:27017
      - DatabaseSettings__DatabaseName=CatalogDb

    networks:
      - catalog-network

  mongo:
    image: mongo:7
    container_name: catalog-mongo

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

    networks:
      - catalog-network
 



  discountdb:
    image: postgres:17

    container_name: discount-postgres

    environment:
      POSTGRES_DB: DiscountDb
      POSTGRES_USER: Admin
      POSTGRES_PASSWORD: Saadpy11@

    restart: always

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - catalog-network 
      
  pgadmin:
    image: dpage/pgadmin4

    container_name: pgadmin

    restart: always

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin

    ports:
      - "5050:80"

    depends_on:
      - discountdb

    networks:
      - catalog-network      
  
  orderdb:
   image: mcr.microsoft.com/mssql/server:2022-latest
   container_name: orderdb
   environment:
     ACCEPT_EULA: "Y"
     SA_PASSWORD: "P@ssw0rd123"

   restart: always
   ports:
     - "1433:1433"
   volumes:
     - orderdb-data:/var/opt/mssql
   healthcheck:
     test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'P@ssw0rd123' -Q 'select 1'"]
     interval: 10s
     timeout: 10s
     retries: 3   
      
       
  basket.api:
    image: ${DOCKER_REGISTRY-}basketapi
    container_name: basket-api

    build:
      context: .
      dockerfile: Services/Basket/Basket.Api/Dockerfile

    ports:
      - "8001:8080"

    depends_on:
      - basketdb

    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - CacheSettings__ConnectionString=basketdb:6379
      - "DiscountSettings__DiscountUrl=http://discount.api:8080"

    networks:
      - catalog-network

  basketdb:
    image: redis:alpine
    container_name: basketdb

    restart: always

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    networks:
      - catalog-network




  discount.api:
    image: ${DOCKER_REGISTRY-}discountapi

    container_name: discount-api

    build:
      context: .
      dockerfile: Services/Discount/Discount.Api/Dockerfile

    ports:
      - "8002:8080"

    depends_on:
      - discountdb

    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__PostgressConnection=Host=discountdb;Port=5432;Database=DiscountDb;Username=Admin;Password=Saadpy11@

    networks:
      - catalog-network

  order.api:
    image: ${DOCKER_REGISTRY-}orderapi
    build:
      context: .
      dockerfile: Services/Order/Order.Api/Dockerfile
    environment:
    - ASPNETCORE_ENVIRONMENT=Development
    - ASPNETCORE_URLS=http://+:8080
    - "ConnectionStrings__OrderingConnectionString=Server=orderdb;Database=OrderDb2;User Id=sa;Password=P@ssw0rd123;TrustServerCertificate=True;"
    depends_on:
      - orderdb
    ports:
     - "8003:8080"
volumes:
  mongo_data:
  redis_data:
  postgres_data:
  orderdb-data:

networks:
  catalog-network:

